<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lawundry - 網頁維護中</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 左側區塊 -->
        <div class="left-panel">
            <div class="logo-section">
                <div class="logo-circle">
                    <img src="favicon.ico" alt="Lawundry Logo">
                </div>
                <h1 class="brand-name">LAWUNDRY</h1>
                <p class="brand-subtitle">法律洗衣機</p>
            </div>
        </div>

        <!-- 右側區塊 -->
        <div class="right-panel">
            <div class="content-wrapper">
                <div class="status-badge">MAINTENANCE</div>
                <h2 class="main-title">網頁維護中</h2>
                <p class="description">
                    本網站目前正在進行維護作業，暫時無法使用。<br>
                    如需嘗試功能或有任何需求，歡迎與我們聯繫。
                </p>

                <div class="divider"></div>

                <div class="contact-section">
                    <h3 class="contact-title">聯絡資訊</h3>
                    <div class="contact-item">
                        <span class="contact-label">GitHub</span>
                        <a href="https://github.com/annieyii/lawundry" target="_blank" rel="noopener noreferrer">github.com/annieyii/lawundry</a>
                    </div>
                    <div class="contact-item">
                        <span class="contact-label">Issues</span>
                        <a href="https://github.com/annieyii/lawundry/issues" target="_blank" rel="noopener noreferrer">提交問題或建議</a>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="canva-section">
                    <h3 class="canva-title">專案簡報</h3>
                    <div class="canva-embed">
                        <iframe 
                            loading="lazy"
                            src="https://www.canva.com/design/DAG7vvbczgk/M_GeCtyiSPpYblIO0v66CA/view?embed"
                            allowfullscreen="allowfullscreen" 
                            allow="fullscreen">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>2024 LAWUNDRY System. All Rights Reserved.</p>
    </footer>
</body>
</html>
